[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eodhd-asset-pricing"
version = "0.1.0"
description = "CLI utility for searching EODHD instruments by asset class."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
eodhd-search = "eodhd_asset_pricing.cli:main"

[tool.setuptools.packages.find]
include = ["eodhd_asset_pricing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
